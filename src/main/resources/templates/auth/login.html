<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LogIn</title>
    <link th:href="@{/css/bootstrap/bootstrap.min.css}" rel="stylesheet">
</head>
<body style="background-color: #dedede">

<div class="container py-5">
    <div class="col-lg-5 mx-auto rounded border p-4" style="background-color: #fff">
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${param.error}" class="alert alert-danger text-center col-10 mx-auto mb-3 alert-dismissible fade show" role="alert">
                <span>Неверный Логин или Пароль</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <h1 class="text-center mb-4">ВХОД</h1>
            <div class="form-group">

                <div class="d-grid col-10 mx-auto mb-3">
                    <label class="col-form-label">Логин:</label>
                    <input name="login" type="text" placeholder="login" required
                           class="form-control" id="login" aria-describedby="login">
                </div>

                <div class="d-grid col-10 mx-auto mb-4">
                    <label class="col-form-label">Пароль:</label>
                    <input name="password" type="password" placeholder="password" required
                           class="form-control" id="password" aria-describedby="password">
                </div>

                <div class="d-grid gap-2 col-10 mx-auto">
                    <button type="submit" class="btn btn-danger">ВОЙТИ</button>
                    <a href="/register" class="btn btn-primary">ЗАРЕГЕСТРИРОВАТЬСЯ</a>
                    <a href="/" class="btn btn-info">ГЛАВНАЯ</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
