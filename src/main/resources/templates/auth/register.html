<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #dedede">
    <div class="container py-5">
        <div class="col-lg-5 mx-auto rounded border p-4" style="background-color: #fff">
            <div th:if="${param.error}" class="alert alert-danger text-center col-10 mx-auto mb-3">
<!--                <span th:text="${param.error}"></span>-->
                <button type="button" class="btn-close" data-bs-dismiss="alert"
                    aria-label="close"></button>
            </div>

            <form th:action="@{/register}" method="post" th:object="${registerDto}">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <h1 class="text-center">РЕГИСТРАЦИЯ</h1>
                <div class="form-group">

                    <div class="d-grid col-10 mx-auto">
                        <label class="col-sm-4 col-form-label">Имя:</label>
                        <input type="text" placeholder="Alex" required
                               class="form-control" id="firstName"
                               aria-describedby="firstName" th:field="${registerDto.firstName}">
                        <p th:if="${#fields.hasErrors('firstName')}"
                            th:errorclass="text-danger"
                            th:errors="${registerDto.firstName}"></p>
                    </div>

                    <div class="d-grid col-10 mx-auto">
                        <label class="col-sm-4 col-form-label">Фамилия:</label>
                        <input type="text" placeholder="Gordon" required
                               class="form-control" id="lastName" aria-describedby="lastName"
                               th:field="${registerDto.lastName}">
                        <p th:if="${#fields.hasErrors('lastName')}"
                           th:errorclass="text-danger"
                           th:errors="${registerDto.lastName}"></p>
                    </div>

                    <div class="d-grid col-10 mx-auto">
                        <label class="col-sm-4 col-form-label">Логин:</label>
                        <input type="text" placeholder="login" required
                               class="form-control" id="login" aria-describedby="login"
                               th:field="${registerDto.login}">
                        <p th:if="${#fields.hasErrors('login')}"
                           th:errorclass="text-danger"
                           th:errors="${registerDto.login}"></p>
                    </div>

                    <div class="d-grid col-10 mx-auto">
                        <label class="col-sm-4 col-form-label">Почта:</label>
                        <input type="text" placeholder="email" required
                               class="form-control" id="email" aria-describedby="email"
                               th:field="${registerDto.email}">
                        <p th:if="${#fields.hasErrors('email')}"
                           th:errorclass="text-danger"
                           th:errors="${registerDto.email}"></p>
                    </div>

                    <div class="d-grid col-10 mx-auto mb-3">
                        <label class="col-sm-4 col-form-label">Пароль:</label>
                        <input type="password" placeholder="password" required
                               class="form-control" id="password" aria-describedby="password"
                               th:field="${registerDto.password}">
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errorclass="text-danger"
                           th:errors="${registerDto.password}"></p>
                    </div>

                    <div class="d-grid col-10 mx-auto mb-3">
                        <label class="col-sm-6 col-form-label">Потверждения Пароля:</label>
                        <input type="password" placeholder="password" required
                               class="form-control" id="confirmPassword" aria-describedby="confirmPassword"
                               th:field="${registerDto.confirmPassword}">
                        <p th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errorclass="text-danger"
                           th:errors="${registerDto.confirmPassword}"></p>
                    </div>

                    <div class="d-grid gap-2 col-10 mx-auto">
                        <button type="submit" class="btn btn-danger">ЗАРЕГЕСТРИРОВАТЬСЯ</button>
                        <a href="/login" type="submit" class="btn btn-primary">ВОЙТИ</a>
                        <a href="/" class="btn btn-info">ГЛАВНАЯ</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
