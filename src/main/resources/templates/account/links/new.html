<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Link</title>

    <link th:href="@{/css/bootstrap/bootstrap.min.css}" rel="stylesheet">

</head>
<body style="background-color: #f8f9fa">
<div class="d-flex" style="min-height: 100vh">
    <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fx-4 fw-bold">ShortLinks</span>
        </a>
        <hr/>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/" class="nav-link text-white opacity-75" aria-current="page">
                    Главная
                </a>
            </li>
            <li class="nav-item">
                <a href="/profile" class="nav-link text-white opacity-75" aria-current="page">
                    Профиль
                </a>
            </li>
            <li class="nav-item">
                <a href="/profile/links/new" class="nav-link active text-white" aria-current="page">
                    Создание ссылки
                </a>
            </li>
            <li>
                <a href="/profile/links" class="nav-link text-white opacity-75" aria-current="page">
                    Мои ссылки
                </a>
            </li>
            <li>
                <a href="/profile/links/analytics" class="nav-link text-white opacity-75">
                    Аналитика
                </a>
            </li>
        </ul>
        <hr/>

        <div class="d-flex align-items-center justify-content-between">
            <strong th:text="${name}">name</strong>
            <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
        </div>
    </div>

    <div class="w-100 p-5">
        <div class="container-fluid">

            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show text-center mb-4"
                 role="alert">
                <span th:text="${error}">error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${success}"
                 class="alert alert-success alert-dismissible fade show text-center mb-4"
                 role="alert">
                <span th:text="${success}">success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>


            <div class="card shadow-sm border-0 p-4" style="background-color: #fff">
                <h2 class="mb-4">Добро пожаловать в панель управления!</h2>
                <p class="text-muted">Здесь вы можете создавать новые короткие ссылки.</p>

                <hr class="my-4">

                <form th:action="@{/profile/links/new}" method="post"
                    th:object="${linksDto}">
                    <h5 class="mb-3">Сократить новую ссылку:</h5>
                    <input type="hidden" name="creator" th:value="${currentId}" />
                    <div class="input-group mb-3 col-lg-8">
                        <input type="text" class="form-control"
                               placeholder="Вставьте длинный URL (например, https://example.com)..."
                                th:field="*{original_link}"/>
                        <button type="submit" class="btn btn-info">Создать</button>
                    </div>
                </form>
                <input type="text" class="form-control" placeholder="Вывод"
                       th:value="${new_link}" disabled />
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
