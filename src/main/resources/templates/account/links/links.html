<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Link</title>

  <link th:href="@{/css/bootstrap/bootstrap.min.css}" rel="stylesheet">

</head>
<body style="background-color: #f8f9fa">
<div class="d-flex" style="min-height: 100vh">
  <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
      <span class="fx-4 fw-bold">ShortLinks</span>
    </a>
    <hr/>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="/" class="nav-link text-white opacity-75" aria-current="page">
          Главная
        </a>
      </li>
      <li class="nav-item">
        <a href="/profile" class="nav-link text-white opacity-75" aria-current="page">
          Профиль
        </a>
      </li>
      <li class="nav-item">
        <a href="/profile/links/new" class="nav-link text-white opacity-75" aria-current="page">
          Создание ссылки
        </a>
      </li>
      <li>
        <a href="/profile/links" class="nav-link text-white active" aria-current="page">
          Мои ссылки
        </a>
      </li>
      <li>
        <a href="/profile/links/analytics" class="nav-link text-white opacity-75">
          Аналитика
        </a>
      </li>
    </ul>
    <hr/>

    <div class="d-flex align-items-center justify-content-between">
      <strong th:text="${name}">name</strong>
      <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
    </div>
  </div>

  <div class="flex-grow-1">
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show text-center mb-4"
         role="alert">
      <span th:text="${error}">error</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show text-center mb-4"
         role="alert">
      <span th:text="${success}">success</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${#lists.isEmpty(linksList)}">
      <h1 class="text-center">У вас нету ссылок</h1>
    </div>

    <table class="table table-dark table-hover"
           th:if="${not #lists.isEmpty(linksList)}">
      <thead>
        <tr class="text-center">
          <th>оригинальная ссылка</th>
          <th>новая ссылка</th>
          <th>количество переходов</th>
          <th>действие</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="link : ${linksList}">
          <td>
            <a class="btn btn-link p-0 text-decoration-none"
               target="_blank"
               th:href="${link.original_link}"
               th:text="${link.original_link}">
              original
            </a>
          </td>

          <td>
            <a class="btn btn-link text-decoration-none"
              th:href="'http://localhost:8081/' + ${link.new_link}"
              target="_blank">
              <i class="bi bi-box-arrow-up-right me-1"></i>
              <span th:text="'http://localhost:8081/' + ${link.new_link}">server</span>
            </a>
          </td>

          <td class="text-center fw-bold text-secondary"
              th:text="${link.clicks}">
            1
          </td>

          <td class="text-center">
            <form th:action="@{/profile/links/manager}" method="post" class="d-line"
                  onsubmit="return confirm('вы уверены совершить действие?')">
              <input type="hidden" name="idLink" th:value="${link.id}" />

              <button type="submit" th:if="${link.isActive}" class="btn btn-warning" name="action" value="deactivate">
                Деактивировать
              </button>
              <button type="submit" th:if="!${link.isActive}" class="btn btn-secondary"
                      name="action" value="activate">
                Активировать
              </button>

              <button class="btn btn-danger" name="action" value="delete">
                Удалить
              </button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
