<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hello World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #dedede">
    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-body-teriary py-3 fs-4">
                <div class="container-fluid">
                    <a class="navbar-brand fs-3" href="#">ShortLinks</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Features</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Pricing</a>
                            </li>
                        </ul>
                    </div>

                    <ul class="navbar-nav" sec:authorize="!isAuthenticated()">
                        <li class="nav-item">
                            <a href="/register" class="btn btn-outline-primary me-2">Register</a>
                        </li>
                        <li class="nav-item">
                            <a href="/login" class="btn btn-primary">Login</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                        <li class="nav-item">
                            <a href="/profile" class="btn btn-outline-primary me-2">Profile</a>
                        </li>
                    </ul>
                    <form sec:authorize="isAuthenticated()" method="post" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                        <button type="submit" class="btn btn-danger">
                            Logout
                        </button>
                    </form>

                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="d-flex flex-column justify-content-center align-items-center" style="min-height: calc(90vh - 46px);">
            <h1>Hello World!</h1>
            <p>What about a new link?</p>
        </div>
    </main>

    <footer>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
